name: Atualizar contadores dos projetos
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/sync-metrics.py', 'metrics-sources.json', '.github/workflows/refresh-metrics.yml']
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: portfolio-metrics
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/sync-metrics.py
      - name: Registrar a consulta
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add project-metrics.json
          if ! git diff --cached --quiet; then
            git commit -m 'Atualiza contadores consultando as fontes originais'
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - uses: actions/deploy-pages@v4
